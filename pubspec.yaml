name: ai_try_on
description: Ouranos Flutter Starter - Bloc
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # DI
  get_it: ^8.0.3

  # Network
  dio: ^5.7.0

  # Router
  go_router: ^14.8.1

  # Functional Programming
  dartz: ^0.10.1

  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Local Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Utils
  logger: ^2.4.0
  intl: ^0.20.1
  equatable: ^2.0.7
  connectivity_plus: ^6.1.1

  cupertino_icons: ^1.0.8

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # Icons
  phosphor_flutter: ^2.1.0

  # Utils - URL
  url_launcher: ^6.3.1

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  gal: ^2.3.0

  # Fonts
  google_fonts: ^6.2.1

  # Env
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

